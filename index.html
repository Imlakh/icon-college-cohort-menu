<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICON College Cohort Schedules</title>

<style>
    :root {
        --radius: 14px;
        --transition: 0.22s ease-out;
        --shadow: 0 3px 10px rgba(0,0,0,0.08);
        --shadow-hover: 0 8px 20px rgba(0,0,0,0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: #f5f5f7;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h1 {
        width: 100%;
        background: #003f7f;
        color: white;
        padding: 16px 10px;
        text-align: center;
        font-size: 1.25rem;
        letter-spacing: 0.3px;
        box-shadow: var(--shadow);
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .container {
        width: 100%;
        max-width: 520px;
        padding: 14px 12px 32px;
    }

    .button {
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        width: 100%;
        min-height: 52px;
        padding: 14px 10px;
        margin: 9px 0;
        color: white;
        text-decoration: none;
        font-size: 0.98rem;
        font-weight: 600;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        transition: transform var(--transition), box-shadow var(--transition), filter var(--transition);
        cursor: pointer;
    }

    @media (hover: hover) and (pointer: fine) {
        .button:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: var(--shadow-hover);
            filter: brightness(1.05);
        }
    }

    /* IMAGE VIEWER */
    .viewer {
        display: none;
        width: 100%;
        max-width: 100%;
        padding: 10px;
        text-align: center;
    }

    .back-btn {
        background: #003f7f;
        color: white;
        padding: 12px 18px;
        border-radius: var(--radius);
        font-weight: 600;
        display: inline-block;
        margin-bottom: 12px;
        cursor: pointer;
        box-shadow: var(--shadow);
        transition: var(--transition);
    }

    @media (hover: hover) and (pointer: fine) {
        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
    }

    /* Scrollable HD image container */
.image-wrapper {
    width: 100%;
    height: 80vh;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    background: white;
    padding: 6px;

    /* Center the image */
    display: flex;
    justify-content: center;
    align-items: center;
}


/* HD image with minimum 50% size */
.image-wrapper img {
    width: auto;
    height: auto;
    max-width: none;
    max-height: none;

    /* Minimum size requirement */
    min-width: 50%;
    min-height: 50%;

    /* Prevent weird spacing */
    display: block;
}

</style>
</head>

<body>

<h1>ICON College Cohort Schedules</h1>

<!-- HOME SCREEN -->
<div class="container" id="home">

    <div class="button" data-url="https://i.ibb.co/fYW30zZ1/Slide1.jpg">April 2026 Cohort</div>
    <div class="button" data-url="https://i.ibb.co/Zzs2gtht/Slide2.jpg">February 2026 Cohort</div>
    <div class="button" data-url="https://i.ibb.co/4V8Lx0d/Slide3.jpg">September 2025 Cohort</div>
    <div class="button" data-url="https://i.ibb.co/XkXkVFSC/Slide4.jpg">April 2025 Cohort</div>
    <div class="button" data-url="https://i.ibb.co/RGwwZ2d3/Slide5.jpg">February 2025 Cohort</div>
    <div class="button" data-url="https://i.ibb.co/8LNDg2Dx/Slide6.jpg">September 2024 Cohort</div>
    <div class="button" data-url="https://i.ibb.co/DfTVqYq6/Slide7.jpg">April 2024 Cohort</div>
    <div class="button" data-url="https://i.ibb.co/ZzLVmGkG/Slide8.jpg">February 2024 Cohort</div>
    <div class="button" data-url="https://i.ibb.co/bMxkcYjF/Slide9.jpg">September 2023 Cohort</div>
    <div class="button" data-url="https://i.ibb.co/nM4pzW6C/Slide10.jpg">April/June 2023 Cohort</div>
    <div class="button" data-url="https://i.ibb.co/Gf6j2MxG/Slide11.jpg">MSc 2025/26</div>
    <div class="button" data-url="https://i.ibb.co/tPJFMd97/Slide12.jpg">MA 2025/26</div>

</div>

<!-- IMAGE VIEWER -->
<div class="viewer" id="viewer">
    <div class="back-btn" onclick="goBack()">← Back to Home</div>

    <div class="image-wrapper">
        <img id="viewerImage" src="">
    </div>
</div>

<script>
    // Random pastel color generator
    function randomColor() {
        const hue = Math.floor(Math.random() * 360);
        return `hsl(${hue}, 70%, 50%)`;
    }

    // Apply random colors
    document.querySelectorAll('.button').forEach(btn => {
        btn.style.backgroundColor = randomColor();
    });

    // Load image into viewer
    document.querySelectorAll('.button').forEach(btn => {
        btn.addEventListener('click', () => {
            const url = btn.getAttribute('data-url');
            document.getElementById('viewerImage').src = url;
            document.getElementById('home').style.display = 'none';
            document.getElementById('viewer').style.display = 'block';
        });
    });

    // Back button
    function goBack() {
        document.getElementById('viewer').style.display = 'none';
        document.getElementById('home').style.display = 'block';
        document.getElementById('viewerImage').src = "";
    }
</script>

</body>
</html>
